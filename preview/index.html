<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ski Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/mapbox-gl@3.9.0/dist/mapbox-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.9.0/dist/mapbox-gl.js"></script>
  <script type="importmap">
    { "imports": { "osmtogeojson": "https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/+esm" } }
  </script>
  <style>
    /* Playful floating UI over a full-screen map: round bubbly buttons, rounded type, bouncy feedback. */
    :root {
      --pop: #ffd84d; --pop-ink: #1f2340; --font: "Nunito", -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --surface: rgba(255, 255, 255, 0.86); --text: #15202b; --muted: #5a6778;
      --accent: #0066e6; --border: rgba(20, 32, 48, 0.1); --tick: rgba(21, 32, 43, 0.35);
      --needle: #d42a2f; --ground: #e8eef5;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: rgba(24, 29, 36, 0.86); --text: #eef2f6; --muted: #a3adba;
        --accent: #4d9bff; --border: rgba(255, 255, 255, 0.1); --tick: rgba(238, 242, 246, 0.4);
        --needle: #ff5a5f; --ground: #151a20;
      }
    }
    :root[data-theme="dark"] {
      --surface: rgba(24, 29, 36, 0.86); --text: #eef2f6; --muted: #a3adba;
      --accent: #4d9bff; --border: rgba(255, 255, 255, 0.1); --tick: rgba(238, 242, 246, 0.4);
      --needle: #ff5a5f; --ground: #151a20;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text);
      font: 600 15px/1.35 var(--font);
      -webkit-tap-highlight-color: transparent; overflow: hidden; }
    [hidden] { display: none !important; }
    #map { position: fixed; inset: 0; }
    .glass { background: var(--surface); backdrop-filter: blur(18px) saturate(1.6);
      -webkit-backdrop-filter: blur(18px) saturate(1.6); border: 1px solid var(--border);
      box-shadow: 0 6px 22px rgba(30, 34, 80, 0.16), 0 1px 3px rgba(30, 34, 80, 0.1); }
    button { transition: transform 220ms var(--spring); }
    button:active { transform: scale(0.88); }
    button:focus-visible, select:focus-visible, #orbit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #search { position: fixed; top: calc(env(safe-area-inset-top) + 8px);
      left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
      height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 10px; padding: 0 18px; z-index: 3; }
    #search input { flex: 1; min-width: 0; appearance: none; border: 0; background: transparent; color: var(--text);
      font: 800 17px/1 var(--font); outline: none; padding: 0; }
    #search input::placeholder { color: var(--muted); font-weight: 700; }
    #search input::-webkit-search-cancel-button { display: none; }
    #world { flex: none; width: 38px; height: 38px; margin-right: -10px; border: 0; border-radius: 50%; cursor: pointer;
      background: transparent; color: var(--text); display: grid; place-items: center; }
    #results { position: fixed; z-index: 5; margin: 0; padding: 6px; list-style: none; border-radius: 22px;
      top: calc(env(safe-area-inset-top) + 68px); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
      max-width: 560px; max-height: min(60vh, 460px); overflow-y: auto; overscroll-behavior: contain; }
    #results li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; cursor: pointer; }
    #results li[aria-selected="true"], #results li[role=option]:hover { background: var(--border); }
    #results li i { width: 12px; height: 12px; border-radius: 50%; flex: none; outline: 2px solid #fff; }
    #results li span { display: grid; min-width: 0; }
    #results li b { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #results li small { color: var(--muted); font-size: 12px; font-weight: 700; }
    #results li.hint { cursor: default; color: var(--muted); font-size: 12px; font-weight: 800; padding: 6px 12px; }
    #search svg { flex: none; opacity: 0.6; }

    #controls { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 3; }
    #controls button { width: 50px; height: 50px; border-radius: 50%; color: var(--text); padding: 0;
      font: 900 15px/1 var(--font); cursor: pointer; display: grid; place-items: center; }

    /* Orbit dial: a compass strip you drag left/right to turn the mountain. */
    #orbit { position: fixed; z-index: 3; height: 50px; border-radius: 25px; overflow: hidden; touch-action: none;
      left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
      bottom: calc(env(safe-area-inset-bottom) + 34px); cursor: grab; user-select: none; -webkit-user-select: none;
      max-width: 560px; margin-inline: auto; }
    #orbit:active { cursor: grabbing; }
    #orbit-strip { position: absolute; inset: 0 auto 0 0; will-change: transform; }
    #orbit-strip span { position: absolute; bottom: 8px; width: 1px; height: 7px; background: var(--tick); }
    #orbit-strip span.mid { height: 11px; }
    #orbit-strip span.big { height: 15px; width: 2px; background: var(--text); }
    #orbit-strip em { position: absolute; bottom: 17px; left: 50%; transform: translateX(-50%); font: 700 11px/1 inherit;
      font-family: var(--font); font-weight: 900; font-style: normal; letter-spacing: 0.06em; color: var(--text); }
    #orbit::before, #orbit::after { content: ""; position: absolute; top: 0; bottom: 0; width: 56px; z-index: 1; pointer-events: none; }
    #orbit::before { left: 0; background: linear-gradient(to right, var(--surface), transparent); }
    #orbit::after { right: 0; background: linear-gradient(to left, var(--surface), transparent); }
    #orbit-needle { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px;
      background: var(--needle); border-radius: 1px; z-index: 2; pointer-events: none; }
    #orbit-play { position: absolute; right: 5px; top: 5px; width: 40px; height: 40px; border-radius: 20px; z-index: 3;
      border: 0; background: var(--pop); color: var(--pop-ink); cursor: pointer; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(30, 34, 80, 0.25); }
    #orbit-play[aria-pressed="true"] .play, #orbit-play[aria-pressed="false"] .pause { display: none; }
    #orbit-hint { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); z-index: 3; pointer-events: none;
      font-size: 11px; font-weight: 600; color: var(--muted); }

    #legend { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: calc(env(safe-area-inset-bottom) + 90px);
      border-radius: 18px; padding: 8px 12px; display: grid; gap: 5px; max-width: calc(100% - 24px);
      font-size: 11.5px; font-weight: 800; z-index: 2; }
    #legend div { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    #legend i { width: 18px; height: 7px; border-radius: 4px; outline: 2px solid #fff; }
    #legend i.cable { height: 2px; background: #1b222c; outline: 2px solid rgba(255, 255, 255, 0.8); }
    #legend b { width: 8px; height: 8px; border-radius: 2px; }
    #legend .lifts { color: var(--muted); }
    #legend.far { display: none; }

    #status { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 66px); transform: translateX(-50%);
      border-radius: 18px; padding: 8px 16px; font-size: 13px; font-weight: 800; color: var(--muted); z-index: 3;
      max-width: calc(100% - 32px); text-align: center; }
    #status:empty { display: none; }

    #card { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
      bottom: calc(env(safe-area-inset-bottom) + 90px); border-radius: 28px; max-width: 560px; margin-inline: auto;
      padding: 16px 18px; display: none; align-items: center; gap: 14px; z-index: 4; }
    #card.show { display: flex; animation: pop-in 420ms var(--spring); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #card.show { animation: none; } button, button:active { transition: none; transform: none; } }
    #card.show ~ #legend { display: none; }
    #card .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; outline: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(30, 34, 80, 0.25); }
    #card b { display: block; font-size: 18px; font-weight: 900; }
    #card small { color: var(--muted); }
    #card button { margin-left: auto; border: 0; background: transparent; font-size: 22px; color: var(--muted); cursor: pointer; }

    #token { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; z-index: 10; background: var(--ground); }
    #token.show { display: grid; }
    #token form { width: 100%; max-width: 420px; border-radius: 20px; padding: 24px; }
    #token h1 { margin: 0 0 6px; font-size: 22px; }
    #token p { margin: 0 0 16px; color: var(--muted); }
    #token input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border); padding: 0 12px;
      font: 15px ui-monospace, Menlo, monospace; background: transparent; color: var(--text); }
    #token button { margin-top: 12px; width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--accent);
      color: #fff; font: 600 16px inherit; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="search" class="glass" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="results">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="resort-q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="go"
           aria-label="Search ski resorts" aria-autocomplete="list" aria-controls="results">
    <button id="world" aria-label="Show all ski resorts" title="All resorts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
    </button>
  </div>
  <ul id="results" class="glass" role="listbox" aria-label="Ski resorts" hidden></ul>

  <div id="controls">
    <button id="toggle3d" class="glass" aria-label="Switch to flat 2D map">2D</button>
    <button id="look" class="glass" aria-label="Switch map style" title="Map style">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button id="light" class="glass" aria-label="Map lighting" title="Lighting">☀︎</button>
  </div>

  <div id="card" class="glass" role="dialog">
    <div class="dot"></div>
    <div><b></b><small></small></div>
    <button aria-label="Close">×</button>
  </div>
  <div id="legend" class="glass" aria-label="Map key"></div>
  <div id="status" class="glass" role="status"></div>

  <div id="orbit" class="glass" role="slider" tabindex="0" aria-label="Turn the view: drag left or right"
       aria-valuemin="0" aria-valuemax="359" aria-valuenow="0">
    <div id="orbit-strip"></div>
    <div id="orbit-needle"></div>
    <button id="orbit-play" aria-pressed="false" aria-label="Fly around the mountain">
      <svg class="play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
      <svg class="pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
  </div>

  <div id="token">
    <form class="glass">
      <h1>Ski map</h1>
      <p>Paste your Mapbox public token (starts with <code>pk.</code>). It is kept in this browser only.</p>
      <input name="t" placeholder="pk.eyJ…" autocomplete="off" required pattern="pk\..+">
      <button>Open map</button>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
